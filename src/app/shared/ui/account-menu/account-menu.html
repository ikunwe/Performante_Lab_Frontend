<button
  #trigger
  type="button"
  aria-label="เมนูบัญชีผู้ใช้"
  [attr.aria-expanded]="open()"
  (click)="open.set(!open())"
  class="flex min-h-10 cursor-pointer items-center gap-2 rounded-lg px-2 text-[11px] text-stone-300 transition-colors hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-red-400"
>
  <app-account-avatar
    [url]="avatarUrl()"
    [name]="name()"
    [complete]="complete()"
    [showStatus]="showStatus()"
  />
  <span class="hidden max-w-32 truncate sm:block" [title]="name()">{{ name() }}</span>
  <app-icon
    name="chevron-down"
    class="!size-2.5 text-stone-500 transition-transform"
    [class.rotate-180]="open()"
  />
</button>
@if (open()) {
  <div
    aria-label="ตัวเลือกบัญชี"
    class="absolute right-0 top-full z-50 mt-2 w-60 max-w-[calc(100vw_-_32px)] rounded-lg border border-white/10 bg-[#1b1b1b] p-2 shadow-[0_12px_40px_#0008]"
  >
    <div class="mb-1 border-b border-white/10 px-3 py-3">
      <p class="truncate text-xs text-stone-100">{{ name() }}</p>
      @if (email()) {
        <p class="mt-1 truncate text-[10px] text-stone-500">{{ email() }}</p>
      }
    </div>
    <button
      type="button"
      (click)="chooseProfile()"
      class="flex min-h-11 w-full cursor-pointer items-center gap-3 rounded-lg px-3 text-left text-xs text-stone-300 hover:bg-white/5 focus-visible:outline-2 focus-visible:outline-red-400"
    >
      <app-icon name="user" class="!size-3.5" />Profile
    </button>
    <button
      type="button"
      (click)="chooseLogout()"
      [disabled]="busy()"
      [attr.aria-busy]="busy()"
      class="flex min-h-11 w-full cursor-pointer items-center gap-3 rounded-lg px-3 text-left text-xs text-red-400 hover:bg-red-500/10 hover:text-red-300 focus-visible:outline-2 focus-visible:outline-red-400 disabled:cursor-not-allowed disabled:opacity-50"
    >
      <app-icon
        [name]="busy() ? 'spinner' : 'logout'"
        class="!size-3.5"
        [class.animate-spin]="busy()"
      />{{ busy() ? 'กำลังออกจากระบบ…' : 'ออกจากระบบ' }}
    </button>
  </div>
}
