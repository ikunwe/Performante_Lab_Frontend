<article
  class="group flex h-full flex-col overflow-hidden rounded-xl border border-white/[.06] bg-[#171717] transition-colors hover:border-white/20"
>
  <button
    type="button"
    class="relative block aspect-[1.8] w-full overflow-hidden bg-[radial-gradient(ellipse_at_50%_35%,#535353,#121212_75%)] text-left focus-visible:outline-2 focus-visible:outline-red-400 cursor-pointer disabled:cursor-not-allowed"
    (click)="details.emit(build())"
    [attr.aria-label]="'ดูรายละเอียด ' + build().title"
  >
    <img
      [src]="build().image"
      [alt]="build().car"
      width="1280"
      height="960"
      loading="lazy"
      class="h-full w-full object-cover"
    />
    <span
      class="absolute left-3 top-3 rounded-full border border-white/10 bg-black/40 px-2 py-1 text-[8px] tracking-widest text-white/80 backdrop-blur"
      >{{ build().category.toUpperCase() }}</span
    >
    <span
      class="absolute bottom-0 inset-x-0 h-10 bg-gradient-to-t from-[#171717] to-transparent"
      aria-hidden="true"
    ></span>
  </button>
  <div class="flex flex-1 flex-col px-3.5 pb-3.5">
    <div class="mb-3 flex items-center gap-2">
      <span class="flex size-6 items-center justify-center rounded-full bg-[#eb3926]"
        ><app-icon name="user" class="!size-3.5"
      /></span>
      <span class="min-w-0 flex-1 truncate text-[10px] text-stone-400">{{ build().author }}</span>
      <button
        type="button"
        class="flex size-7 items-center justify-center rounded-md text-stone-500 hover:bg-white/5 hover:text-white focus-visible:outline-2 focus-visible:outline-red-400 cursor-pointer disabled:cursor-not-allowed"
        [class.text-red-400]="saved()"
        [attr.aria-pressed]="saved()"
        [attr.aria-label]="saved() ? 'เลิกบันทึก ' + build().title : 'บันทึก ' + build().title"
        (click)="save.emit(build())"
      >
        <app-icon name="bookmark" class="!size-3.5" />
      </button>
    </div>
    <h2 class="mb-1 font-[family-name:var(--font-display)] text-[11px] tracking-tight">
      {{ build().title }}
    </h2>
    <p class="mb-3 text-[10px] text-stone-500">{{ build().car }}</p>
    <div class="mb-3 mt-auto flex items-end justify-between gap-2 border-t border-white/5 pt-2.5">
      <span class="text-[9px] text-stone-500">งบประมาณตัวอย่าง</span
      ><span class="text-[11px] text-stone-300">฿{{ build().budget | number }}</span>
    </div>
    <button
      type="button"
      class="flex min-h-9 items-center justify-between rounded-md bg-[#ce281a] px-3 text-[9px] text-white transition-colors hover:bg-[#ef402b] focus-visible:outline-2 focus-visible:outline-red-300 cursor-pointer disabled:cursor-not-allowed"
      (click)="details.emit(build())"
    >
      <span class="font-[family-name:var(--font-display)]">SEE DETAILS</span
      ><app-icon name="arrow" class="!size-3.5" />
    </button>
    <button
      type="button"
      class="mt-2 flex min-h-7 items-center justify-center gap-1.5 text-[10px] text-stone-400 hover:text-white focus-visible:outline-2 focus-visible:outline-red-400 cursor-pointer disabled:cursor-not-allowed"
      (click)="copy.emit(build())"
    >
      <app-icon name="plus" class="!size-3" />ใช้เป็นต้นแบบ Build
    </button>
  </div>
</article>
